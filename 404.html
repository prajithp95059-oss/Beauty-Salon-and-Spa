<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<script src="preloader.js"></script>
<title>404 – Page not found | Stackly Beauty Salon &amp; Spa</title>
<meta name="description" content="The page you are looking for could not be found. Go back or return to the Stackly Beauty Salon & Spa home page." />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#3B1F3A" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
/* ==========================================================
   Stackly Beauty Salon & Spa — 404 (site tokens + animations)
   ========================================================== */
:root{--cream:#FBF5EA;--sand:#F1E6D2;--plum:#3B1F3A;--plum2:#2A152A;--rose:#C98A8F;--sage:#8FA48B;--gold:#B88A44;--ink:#2B1B2A;--white:#FFFDF8;--h:'Cormorant Garamond',Georgia,serif;--b:'Jost',system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{font-family:var(--b);background:var(--plum2);color:var(--cream);line-height:1.7;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1{font-family:var(--h);font-weight:600;line-height:1.1;color:var(--white);text-wrap:balance}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px;border-radius:6px}
.wrap{width:min(92%,1200px);margin-inline:auto}

/* ----- the site's keyframes ----- */
@keyframes rise{to{opacity:1;transform:none}}
@keyframes up{to{transform:none}}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.5)}}
@keyframes float{50%{transform:translateY(-14px)}}
@keyframes zoom{to{transform:scale(1)}}
@keyframes load{to{transform:scaleX(1)}}

/* rose progress bar */
#bar{position:fixed;top:0;left:0;height:4px;width:100%;background:linear-gradient(90deg,var(--rose),var(--gold));transform:scaleX(0);transform-origin:left;z-index:100;animation:load 1.1s var(--ease) .1s forwards}

/* buttons (same pill style + shine as the site) */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 30px;border-radius:50px;font:500 1rem var(--b);cursor:pointer;border:1.5px solid var(--rose);background:var(--rose);color:#fff;transition:transform .35s,background .35s,color .35s,border-color .35s,box-shadow .35s}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(0,0,0,.28)}
.btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:.7s}
.btn:hover::after{left:130%}
.btn svg{transition:transform .3s}
.btn.rose:hover{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.rose:hover svg{transform:translateX(4px)}
.btn.ghost{background:transparent;color:var(--cream);border-color:var(--cream)}
.btn.ghost:hover{background:var(--cream);color:var(--plum)}
.btn.ghost:hover svg{transform:translateX(-4px)}

/* ---------- 404 page ---------- */
.e404{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;overflow:hidden;padding:clamp(2rem,6vh,4rem) 0;color:var(--cream)}
.e404 .ph{position:absolute;inset:-8% 0;z-index:0;background:var(--plum2);overflow:hidden}
.e404 .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4;transform:scale(1.12);animation:zoom 2.4s var(--ease) forwards}
.e404::after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(60% 55% at 85% 8%,rgba(184,138,68,.26),transparent 70%),radial-gradient(55% 60% at 8% 92%,rgba(201,138,143,.30),transparent 70%),linear-gradient(0deg,rgba(42,21,42,.94),rgba(59,31,58,.8) 60%,rgba(59,31,58,.66))}
/* soft floating orbs, like the home hero */
.orb{position:absolute;z-index:1;border-radius:50%;filter:blur(60px);pointer-events:none;animation:float 9s ease-in-out infinite}
.orb.o1{width:340px;height:340px;background:rgba(201,138,143,.22);top:-110px;left:-110px}
.orb.o2{width:300px;height:300px;background:rgba(143,164,139,.2);bottom:-100px;right:-90px;animation-duration:11s;animation-direction:reverse}
.e404 .wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.tag{display:inline-block;background:var(--sand);color:var(--gold);padding:6px 18px;border-radius:50px;font-weight:500;font-size:.9rem;margin-bottom:.6rem;animation:pop .8s .1s both}
.e404-num{display:flex;align-items:center;justify-content:center;gap:.04em;font-family:var(--h);font-weight:600;font-size:clamp(5.5rem,24vw,13rem);line-height:1;color:var(--cream);letter-spacing:-.02em;margin:.1em 0 .18em;user-select:none;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.e404-num>span{display:block;transform:translateY(110%);opacity:0;animation:up .9s var(--ease) .1s forwards,show .9s .1s forwards}
.e404-num>span:nth-child(2){animation-delay:.18s;color:var(--rose);font-style:italic}
.e404-num>span:last-child{animation-delay:.26s}
/* heading reveals line by line */
.e404 h1{font-size:clamp(2rem,5.2vw,3.4rem);max-width:24ch;margin-bottom:1rem;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.e404 h1 span{display:block;overflow:hidden;padding-bottom:.08em}
.e404 h1 b{display:inline-block;font-weight:600;transform:translateY(110%);animation:up .9s var(--ease) .1s forwards}
.e404 h1 span:nth-child(2) b{animation-delay:.25s}
.e404 h1 i{font-style:italic;color:var(--rose)}
.e404 p.lead{max-width:52ch;margin-bottom:2rem;color:var(--sand);font-size:1.1rem;font-weight:300;opacity:0;animation:show .8s .7s forwards}
.e404 .btn-row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;opacity:0;animation:show .8s .9s forwards}
@media (max-width:600px){
  .e404 .btn-row{flex-direction:column;align-items:stretch;width:100%;max-width:340px}
  .e404 .btn{width:100%}
  .e404 p.lead{margin-bottom:1.6rem}
}
@media (max-width:380px){.e404-num{font-size:clamp(4.6rem,25vw,5.5rem)}}
@media (max-height:560px) and (orientation:landscape){
  .e404{min-height:auto;padding:1.5rem 0}
  .e404-num{font-size:clamp(4rem,16vh,6.5rem);margin:.05em 0 .1em}
  .e404 h1{font-size:1.6rem;margin-bottom:.6rem}
  .e404 p.lead{margin-bottom:1.2rem}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  #bar{transform:scaleX(1)}
  .e404-num>span,.e404 h1 b{transform:none;opacity:1}
  .e404 p.lead,.e404 .btn-row{opacity:1}
  .e404 .ph img{transform:none}
}
</style>
</head>
<body>

<div id="bar"></div>
<main id="main">
<section class="e404">
  <div class="ph">
    <img src="./assets/img3.webp" alt="" decoding="async" />
  </div>
  <span class="orb o1" aria-hidden="true"></span><span class="orb o2" aria-hidden="true"></span>
  <div class="wrap">
    <span class="tag">Error 404</span>
    <div class="e404-num" aria-hidden="true"><span>4</span><span>0</span><span>4</span></div>
    <h1><span><b>We could not find</b></span><span><b>that <i>page</i></b></span></h1>
    <p class="lead">The page you are looking for may have moved, been renamed or simply drifted away. Go back to where you were, or head home to explore our services and book your visit.</p>
    <div class="btn-row">
      <button type="button" class="btn ghost back" id="goBack"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>Go back</span></button>
      <a class="btn rose" href="index.html"><span>Back to home</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
  </div>
</section>
</main>

<script>
(function(){
  /* go back to the previous page and restore its scroll position */
  try{if('scrollRestoration' in history)history.scrollRestoration='auto'}catch(_){}
  var b=document.getElementById('goBack');
  if(b){
    b.addEventListener('click',function(){
      if(window.history.length>1){
        var t=setTimeout(function(){window.location.href='index.html'},900);
        var stop=function(){clearTimeout(t)};
        window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',stop);
        window.history.back();
      }else{window.location.href='index.html'}
    });
  }


  /* background image fallback */
  var bg=document.querySelector('.e404 .ph img');
  if(bg)bg.addEventListener('error',function(){bg.src='assets/home bg1.webp'},{once:true});

})();
</script>
</body>
</html>
